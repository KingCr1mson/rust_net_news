[package]
name = "rust_net_news"
version = "0.1.0"
edition = "2021"
description = "抓取 IT之家与 Hacker News 当天的 RSS 条目并按统一格式输出"

[lib]
name = "rust_net_news"
path = "src/lib.rs"

[[bin]]
name = "rust_net_news"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
feed-rs = "3.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6.5"
